name: validate-compose

# The Pi's GitOps cron auto-deploys origin/main every 5 min. A malformed compose
# file would break the running stack on the next tick, so validate the merged
# config (root docker-compose.yml + every include) on each push and PR.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder .env files
        # Services reference `env_file: .env` (gitignored secrets). They don't
        # exist in CI, and `docker compose config` errors on a missing env_file.
        # Empty placeholders let it parse; unset ${VARS} just interpolate to "".
        run: find . -name docker-compose.yml -execdir touch .env \;

      - name: Validate merged compose
        run: docker compose config -q

      - name: No ${VAR} interpolation in environment entries
        # Interpolation reads the ROOT .env (empty by design), so
        # `- X=${X}` silently shadows a good env_file value with "" — the
        # cups/homepage bug (fixed 2026-08-30). Put the value in the service's
        # .env instead.
        run: |
          if grep -rnE '^\s*(-\s*[A-Za-z_][A-Za-z0-9_]*=|[A-Za-z_][A-Za-z0-9_]*:\s*)["'"'"']?\$\{' \
              --include=docker-compose.yml --exclude-dir=deprecated .; then
            echo "::error::\${VAR} interpolation in an environment entry (see AGENTS.md > Service conventions)"
            exit 1
          fi
