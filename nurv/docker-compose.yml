# Deploy config only — app code lives in the app repo:
# https://github.com/ankitsxchdeva/nurv
#
# Deployed via the ROOT compose's `include:` (project home-server) — do NOT
# add a top-level `name:` here; it is ignored on include, and running this
# file standalone would orphan the live home-server_db-data volume.
# Container names anesthesia-* and db creds `anesthesia` stay so the live
# volume and containers carry over across the nurv rename; the new schema
# lands via db/migrations/001_nurv.sql from the app repo (applied manually).
#
# Note the build context pins to main: a push to the app repo does NOT
# redeploy on its own, because the GitOps cron only rebuilds when THIS repo
# changes. To pick up an app change: `docker compose build --no-cache` the
# service && `docker compose up -d` — plain `--build` reuses BuildKit's
# cached git clone of #main and silently ships stale code (bit us with
# quantlab 2026-08-29).

services:
  db:
    build:
      context: https://github.com/ankitsxchdeva/nurv.git#main
      dockerfile: db/Dockerfile
    container_name: anesthesia-db
    restart: unless-stopped
    env_file:
      - .env # POSTGRES_PASSWORD, TZ
    environment:
      - POSTGRES_USER=anesthesia
      - POSTGRES_DB=anesthesia
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anesthesia -d anesthesia"]
      interval: 5s
      timeout: 3s
      retries: 12
    # No published port. App-internal; psql via `docker compose exec db`.

  api:
    build:
      context: https://github.com/ankitsxchdeva/nurv.git#main
      dockerfile: api/Dockerfile
    container_name: anesthesia-api
    restart: unless-stopped
    env_file:
      - .env # POSTGRES_PASSWORD (api reads it directly), JWT_SECRET, TZ
    environment:
      - PGHOST=db
      - PGUSER=anesthesia
      - PGDATABASE=anesthesia
      - PGPORT=5432
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
    # No published port. Reached by the web service (and the tunnel) over
    # the default network.

  web:
    build:
      context: https://github.com/ankitsxchdeva/nurv.git#main
      dockerfile: web/Dockerfile
      args:
        BASE_PATH: /anesthesia
        API_URL: http://api:4000
    container_name: anesthesia-web
    restart: unless-stopped
    depends_on:
      - api
    # Fallback exposure while cutover to Cloudflare completes: funnel
    # :10000 → caddy :8089, Caddyfile `handle /anesthesia*` →
    # anesthesia-web:3000 (no strip; app serves under basePath /anesthesia).
    # Primary public frontend is the `nurv` Cloudflare Worker at nurv.space.
    networks:
      - default
      - caddy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nurv-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env # TUNNEL_TOKEN (Cloudflare dashboard → Networks → Tunnels)
    depends_on:
      - api
    # Exposes the API as https://api.nurv.space → http://api:4000 (public
    # hostname configured dashboard-side on the tunnel; DNS is automatic).

networks:
  caddy:
    external: true # created by the caddy project
    name: home-server_default

volumes:
  db-data:
