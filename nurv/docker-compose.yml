# Deploy config only — app code lives in the app repo:
# https://github.com/ankitsxchdeva/nurv
#
# Deployed via the ROOT compose's `include:` (project home-server) — do NOT
# add a top-level `name:` here; it is ignored on include, and running this
# file standalone would orphan the live home-server_db-data volume.
# Schema changes land via db/migrations/NNN_*.sql in the app repo, applied
# manually (see README).
#
# Note the build context pins to main: a push to the app repo does NOT
# redeploy on its own, because the GitOps cron only rebuilds when THIS repo
# changes. To pick up an app change: `docker compose build --no-cache` the
# service && `docker compose up -d` — plain `--build` reuses BuildKit's
# cached git clone of #main and silently ships stale code (bit us with
# quantlab 2026-08-29).

services:
  db:
    build:
      context: https://x-access-token:${NURV_GH_PAT}@github.com/ankitsxchdeva/nurv.git#main
      dockerfile: db/Dockerfile
    container_name: nurv-db
    restart: unless-stopped
    env_file:
      - .env # POSTGRES_PASSWORD, TZ
    environment:
      - POSTGRES_USER=nurv
      - POSTGRES_DB=nurv
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nurv -d nurv"]
      interval: 5s
      timeout: 3s
      retries: 12
    # No published port. App-internal; psql via `docker compose exec db`.

  api:
    build:
      context: https://x-access-token:${NURV_GH_PAT}@github.com/ankitsxchdeva/nurv.git#main
      dockerfile: api/Dockerfile
    container_name: nurv-api
    restart: unless-stopped
    env_file:
      - .env # POSTGRES_PASSWORD (api reads it directly), JWT_SECRET, TZ
    environment:
      - PGHOST=db
      - PGUSER=nurv
      - PGDATABASE=nurv
      - PGPORT=5432
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
    # No published port. Reached only by the tunnel over the default network;
    # the web frontend is the `nurv` Cloudflare Worker at nurv.space.

  tunnel:
    # Pinned: watchtower recreates :latest daily, so the tunnel (and the
    # whole API) would change under us without a deploy. Bump deliberately.
    image: cloudflare/cloudflared:2026.10.3
    container_name: nurv-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env # TUNNEL_TOKEN (Cloudflare dashboard → Networks → Tunnels)
    depends_on:
      - api
    # Exposes the API as https://api.nurv.space → http://api:4000 (public
    # hostname configured dashboard-side on the tunnel; DNS is automatic).

volumes:
  db-data:
