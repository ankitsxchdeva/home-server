services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      # localhost-only: the host watchdogs (scripts/*watchdog) push heartbeats
      # to 127.0.0.1:3001. Everyone else uses https://kuma.ankit.casa.
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data  # Persistent data

