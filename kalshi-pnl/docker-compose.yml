services:
  kalshi-pnl:
    build: .
    container_name: kalshi-pnl
    restart: unless-stopped
    # No published port — public via funnel :10000 → caddy :8089 (/ route),
    # tailnet via https://kalshi.ankit.casa.
    volumes:
      - ./kalshi_private_key.pem:/app/kalshi_private_key.pem:ro
    env_file:
      - .env
