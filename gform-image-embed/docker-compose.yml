services:
  gform-image-embed:
    build: .
    container_name: gform-image-embed
    restart: unless-stopped
    mem_limit: 1g      # headless Chromium; cap so a runaway browser OOMs itself, not the Pi
    # reap zombie chromium/node children left by per-request Playwright launches
    init: true
    env_file:
      - .env
