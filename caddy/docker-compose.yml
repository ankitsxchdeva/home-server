services:
  caddy:
    container_name: caddy
    build: .
    restart: unless-stopped
    # --watch does NOT survive git's inode swap on deploy (verified 2026-08-30):
    # the GitOps cron gracefully reloads caddy after each pull instead
    # (scripts/crontab.txt). The directory bind-mount below is still required:
    # a single-file mount would pin the old inode and even a manual reload
    # would read stale config.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    # host resolv.conf points at Tailscale MagicDNS, unreachable from
    # bridge containers — ACME needs working external DNS
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./conf:/etc/caddy:ro          # mount the DIR (not the file) so deploys don't serve stale config
      - ./data:/data
      - ./config:/config
    networks:
      - default
