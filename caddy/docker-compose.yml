services:
  caddy:
    container_name: caddy
    build: .
    restart: unless-stopped
    # --watch auto-reloads on Caddyfile changes. Paired with the directory
    # bind-mount below, this survives git's inode swap on deploy (a single-file
    # mount would pin the old inode and serve stale config).
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    # host resolv.conf points at Tailscale MagicDNS, unreachable from
    # bridge containers — ACME needs working external DNS
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./conf:/etc/caddy:ro          # mount the DIR (not the file) so deploys don't serve stale config
      - ./data:/data
      - ./config:/config
    networks:
      - default
