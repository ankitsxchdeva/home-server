services:
  quantlab:
    # Built straight from the app repo so the source lives in exactly one place.
    # Note this pins to main: a push to quantlab does NOT redeploy on its own,
    # because the GitOps cron only rebuilds when THIS repo changes. To pick up
    # an app change: `docker compose build --no-cache quantlab && docker
    # compose up -d quantlab` — plain `--build` reuses BuildKit's cached git
    # clone of #main and silently ships stale code (bit us 2026-08-29).
    build:
      context: https://github.com/ankitsxchdeva/quantlab.git#main
    container_name: quantlab
    restart: unless-stopped
    cpus: "2.0"        # backtests are CPU-bound; cap so a big run can't stall the Pi
    environment:
      # CORS allowlist. The static UI is served from GitHub Pages, so its origin
      # has to be named here or the browser discards every response.
      #
      # Both entries are load-bearing: the github.io user site carries the
      # custom domain ankitsachdeva.com, so project sites are served from
      # ankitsachdeva.com/quantlab/ and THAT is the Origin browsers send.
      # github.io stays listed because it still resolves and redirects.
      - ALLOWED_ORIGINS=https://ankitsachdeva.com,https://ankitsxchdeva.github.io
    # No env_file: this app holds no secrets. Strategy compilation defaults to
    # the local Ollama (keyless, app-level rate limits: 5/min per IP, 60/hr
    # global, 2 concurrent); visitors can instead paste their own LLM key in the
    # browser, forwarded per-request. Kalshi market data is public.
    #
    # No published port. Public exposure: funnel :10000 → caddy :8089, where
    # the Caddyfile routes /quantlab* here (handle_path strip — same behavior
    # as the old tailscaled mount, but versioned in git instead of host state).
    # Tailnet: https://quantlab.ankit.casa.
