<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>parking</title>
<style>
  /* Colophon design language (~/Documents/design/DESIGN.md v0.7, canonical lane).
     Tokens mirror tokens.css: absence of data-theme follows prefers-color-scheme. */
  @font-face {
    font-family: "Lato";
    src: url("fonts/lato-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Lato";
    src: url("fonts/lato-700.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    color-scheme: light;
    --bg: #f5f4fa;
    --fg: #30292f;
    --muted: #6a6884;
    --border: #d8d6e8;
    --accent: #355691;
    --accent-hover: #5f5aa2;
    --dim: 0.75;
    --t: 150ms cubic-bezier(0.25, 1, 0.5, 1);
    --focus-ring: 2px solid var(--accent-hover);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1c22;
    --fg: #e8e4f4;
    --muted: #8e8aab;
    --border: #413f54;
    --accent: #8b87c8;
    --accent-hover: #9db8dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1e1c22;
      --fg: #e8e4f4;
      --muted: #8e8aab;
      --border: #413f54;
      --accent: #8b87c8;
      --accent-hover: #9db8dc;
    }
  }

  ::selection { background: var(--accent); color: var(--bg); }
  :focus-visible {
    outline: var(--focus-ring);
    outline-offset: 3px;
    border-radius: 2px;
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Lato", Verdana, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 3.5em 1.25em;
  }
  main { width: 100%; max-width: 340px; }

  main > * { animation: enter 450ms cubic-bezier(0.25, 1, 0.5, 1) both; }
  main > *:nth-child(2) { animation-delay: 70ms; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  h1 {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 1em;
  }

  form { display: grid; gap: 1em; }
  input {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.55em 0.7em;
    transition: border-color var(--t);
  }
  input::placeholder { color: var(--muted); opacity: var(--dim); }
  input:hover { border-color: var(--muted); }
  input:focus { border-color: var(--accent); }

  button {
    font: inherit;
    font-weight: 700;
    color: var(--accent);
    background: transparent;
    border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--border));
    border-radius: 2px;
    padding: 0.7em 1em;
    cursor: pointer;
    transition: color var(--t), border-color var(--t), background-color var(--t);
  }
  button:hover {
    color: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* failures render in muted ink and name the retry, never alarm red */
  #error {
    display: none;
    color: var(--muted);
    font-size: 13px;
  }
  #error.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main>
  <h1>parking</h1>
  <form method="post" action="login">
    <input type="password" name="password" placeholder="password" required autofocus
           autocomplete="current-password">
    <p id="error" class="{{ERROR}}">wrong password, try again.</p>
    <button type="submit">sign in</button>
  </form>
</main>
</body>
</html>
