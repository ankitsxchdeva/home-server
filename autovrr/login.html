<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🅿️</text></svg>">
<style>
  :root {
    --bg: oklch(0.972 0.005 100);
    --surface: oklch(0.995 0.002 100);
    --ink: oklch(0.27 0.02 165);
    --muted: oklch(0.52 0.015 165);
    --border: oklch(0.885 0.012 165);
    --accent: oklch(0.46 0.09 165);
    --accent-ink: oklch(0.985 0.005 165);
    --accent-soft: oklch(0.94 0.03 165);
    --error: oklch(0.5 0.15 25);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 340px; }
  h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 24px; }
  form { display: grid; gap: 14px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: border-color 0.15s ease-out, box-shadow 0.15s ease-out;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    font: inherit;
    font-size: 1.02rem;
    font-weight: 650;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: filter 0.15s ease-out, transform 0.1s ease-out;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(0.985); }
  #error {
    display: none;
    color: var(--error);
    font-size: 0.9rem;
    font-weight: 550;
  }
  #error.show { display: block; }
</style>
</head>
<body>
<main>
  <h1>Parking</h1>
  <form method="post" action="login">
    <input type="password" name="password" placeholder="Password" required autofocus
           autocomplete="current-password">
    <p id="error" class="{{ERROR}}">Wrong password. Try again.</p>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
