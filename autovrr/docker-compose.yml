services:
  autovrr:
    build: .
    container_name: autovrr
    restart: unless-stopped
    mem_limit: 1g      # headless Chromium; cap so a runaway browser OOMs itself, not the Pi
    env_file:
      - .env
    # Guest parking web page (web.py) — tailnet via https://park.ankit.casa,
    # public via funnel :10000 → caddy :8089 (Caddyfile routes
    # /$PARK_PUBLIC_PATH here; the path lives in caddy/.env). No published port.
