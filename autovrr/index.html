<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parking</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🅿️</text></svg>">
<style>
  :root {
    --bg: oklch(0.972 0.005 100);
    --surface: oklch(0.995 0.002 100);
    --ink: oklch(0.27 0.02 165);
    --muted: oklch(0.52 0.015 165);
    --border: oklch(0.885 0.012 165);
    --accent: oklch(0.46 0.09 165);
    --accent-ink: oklch(0.985 0.005 165);
    --accent-soft: oklch(0.94 0.03 165);
    --error: oklch(0.5 0.15 25);
    --error-soft: oklch(0.94 0.03 25);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 400px; }

  header { margin-bottom: 24px; }
  h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; }

  form { display: grid; gap: 18px; }
  .field { display: grid; gap: 6px; }
  .field.combo { position: relative; }
  label { font-size: 0.85rem; font-weight: 600; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1rem; /* 16px: no iOS zoom-on-focus */
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    transition: border-color 0.15s ease-out, box-shadow 0.15s ease-out;
  }
  input::placeholder { color: var(--muted); opacity: 0.75; }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #plate { text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }

  .combo-list {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    margin-top: 6px;
    padding: 4px;
    list-style: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px oklch(0.27 0.02 165 / 0.12);
    max-height: 232px;
    overflow-y: auto;
    z-index: 5;
  }
  .combo-list li {
    padding: 10px 12px;
    border-radius: 7px;
    font-size: 0.97rem;
    cursor: pointer;
  }
  .combo-list li.active { background: var(--accent-soft); }
  .combo-list li .hint { color: var(--muted); font-size: 0.85rem; }

  fieldset {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: grid;
    gap: 14px;
    background: color-mix(in oklch, var(--surface) 55%, var(--bg));
  }
  legend {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    padding: 0 6px;
  }

  button[type="submit"] {
    font: inherit;
    font-size: 1.02rem;
    font-weight: 650;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: filter 0.15s ease-out, transform 0.1s ease-out;
  }
  button[type="submit"]:hover { filter: brightness(1.07); }
  button[type="submit"]:active { transform: scale(0.985); }
  button[type="submit"]:disabled { opacity: 0.55; cursor: wait; }

  #result {
    display: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 0.95rem;
    margin-top: 22px;
  }
  #result.show { display: block; }
  #result.ok { background: var(--accent-soft); }
  #result.err { background: var(--error-soft); }
  #result strong { display: block; margin-bottom: 4px; font-size: 1rem; }
  #result .detail { color: var(--ink); opacity: 0.85; }

  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: color-mix(in oklch, var(--bg) 82%, transparent);
    place-items: center;
    z-index: 10;
  }
  #overlay.show { display: grid; }
  .spinner-box { text-align: center; }
  .spinner {
    width: 44px; height: 44px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-box p { font-weight: 600; }
  .spinner-box small { color: var(--muted); display: block; margin-top: 4px; }

  footer { margin-top: 28px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Parking</h1>
  </header>

  <form id="park-form" autocomplete="off">
    <div class="field">
      <label for="plate">License plate</label>
      <input id="plate" name="plate" required maxlength="10"
             placeholder="ABC1234" autocapitalize="characters" spellcheck="false">
    </div>

    <div class="field combo">
      <label for="make">Vehicle make</label>
      <input id="make" name="make" required maxlength="40" placeholder="Start typing…"
             role="combobox" aria-expanded="false" aria-controls="make-list" spellcheck="false">
      <ul id="make-list" class="combo-list" role="listbox" hidden></ul>
    </div>

    <div class="field combo">
      <label for="model">Vehicle model</label>
      <input id="model" name="model" required maxlength="40" placeholder="Start typing…"
             role="combobox" aria-expanded="false" aria-controls="model-list" spellcheck="false">
      <ul id="model-list" class="combo-list" role="listbox" hidden></ul>
    </div>

    <fieldset>
      <legend>About you — optional</legend>
      <div class="field">
        <label for="vname">Name</label>
        <input id="vname" name="vname" maxlength="80" placeholder="{{GUEST_NAME}}">
      </div>
      <div class="field">
        <label for="vphone">Phone</label>
        <input id="vphone" name="vphone" type="tel" maxlength="20" placeholder="{{GUEST_PHONE}}">
      </div>
      <div class="field">
        <label for="vemail">Email</label>
        <input id="vemail" name="vemail" type="email" maxlength="80" placeholder="{{GUEST_EMAIL}}">
      </div>
    </fieldset>

    <button type="submit" id="submit">Register parking</button>
  </form>

  <div id="result" role="status"></div>

  <footer>Passes are valid 24 hours.</footer>
</main>

<div id="overlay">
  <div class="spinner-box">
    <div class="spinner"></div>
    <p>Registering with VRR Parking</p>
    <small>Usually 20&ndash;40 seconds. Don&rsquo;t close this page.</small>
  </div>
</div>

<script>
const MAKES = ["Acura","Audi","BMW","Buick","Cadillac","Chevrolet","Chrysler","Dodge","Ford","Genesis","GMC","Honda","Hyundai","Infiniti","Jeep","Kia","Lexus","Lincoln","Mazda","Mercedes-Benz","Mini","Mitsubishi","Nissan","Polestar","Porsche","Ram","Rivian","Subaru","Tesla","Toyota","Volkswagen","Volvo"];
const MODELS = {
  Acura: ["Integra","TLX","RDX","MDX"],
  Audi: ["A3","A4","A6","Q3","Q5","Q7","e-tron"],
  BMW: ["2 Series","3 Series","4 Series","5 Series","X1","X3","X5","i4","iX"],
  Buick: ["Encore","Encore GX","Envision","Enclave"],
  Cadillac: ["CT4","CT5","XT4","XT5","Escalade","Lyriq"],
  Chevrolet: ["Silverado","Equinox","Malibu","Traverse","Tahoe","Suburban","Colorado","Bolt","Blazer"],
  Chrysler: ["300","Pacifica","Voyager"],
  Dodge: ["Charger","Challenger","Durango","Hornet"],
  Ford: ["F-150","Mustang","Escape","Explorer","Edge","Bronco","Maverick","Fusion","Ranger"],
  Genesis: ["G70","G80","G90","GV70","GV80"],
  GMC: ["Sierra","Yukon","Acadia","Terrain","Canyon"],
  Honda: ["Civic","Accord","CR-V","HR-V","Pilot","Odyssey","Ridgeline","Passport"],
  Hyundai: ["Elantra","Sonata","Tucson","Santa Fe","Kona","Palisade","Ioniq 5","Ioniq 6"],
  Infiniti: ["Q50","Q60","QX50","QX55","QX60","QX80"],
  Jeep: ["Wrangler","Grand Cherokee","Cherokee","Compass","Gladiator","Wagoneer"],
  Kia: ["Forte","K5","Sportage","Sorento","Telluride","Soul","EV6","Seltos"],
  Lexus: ["IS","ES","LS","NX","RX","GX","LX"],
  Lincoln: ["Corsair","Nautilus","Aviator","Navigator"],
  Mazda: ["Mazda3","Mazda6","CX-30","CX-5","CX-50","CX-90"],
  "Mercedes-Benz": ["A-Class","C-Class","E-Class","S-Class","GLA","GLC","GLE","GLS","EQS"],
  Mini: ["Cooper","Cooper S","Countryman","Clubman"],
  Mitsubishi: ["Outlander","Outlander Sport","Eclipse Cross","Mirage"],
  Nissan: ["Sentra","Altima","Maxima","Rogue","Pathfinder","Frontier","Kicks","Leaf","Ariya"],
  Polestar: ["Polestar 2","Polestar 3","Polestar 4"],
  Porsche: ["911","718","Taycan","Panamera","Macan","Cayenne"],
  Ram: ["1500","2500","ProMaster"],
  Rivian: ["R1T","R1S"],
  Subaru: ["Impreza","Legacy","Crosstrek","Forester","Outback","Ascent","WRX","BRZ"],
  Tesla: ["Model 3","Model Y","Model S","Model X","Cybertruck"],
  Toyota: ["Corolla","Camry","RAV4","Highlander","Tacoma","Tundra","Prius","4Runner","Sienna","Corolla Cross","GR86"],
  Volkswagen: ["Jetta","Golf","GTI","Taos","Tiguan","Atlas","ID.4"],
  Volvo: ["S60","S90","XC40","XC60","XC90","EX30","EX90"]
};

// Lightweight combobox: opens on focus, live-filters, tap/arrow+enter to
// pick, freeform text always allowed.
function combobox(input, listEl, getOptions) {
  let options = [], active = -1;

  function render() {
    const q = input.value.trim().toLowerCase();
    options = getOptions().filter(o => !q || o.toLowerCase().includes(q)).slice(0, 8);
    listEl.replaceChildren();
    active = -1;
    if (!options.length) { close(); return; }
    options.forEach((o, i) => {
      const li = document.createElement("li");
      li.textContent = o;
      li.setAttribute("role", "option");
      li.addEventListener("pointerdown", (e) => { e.preventDefault(); pick(o); });
      li.addEventListener("pointerenter", () => setActive(i));
      listEl.appendChild(li);
    });
    listEl.hidden = false;
    input.setAttribute("aria-expanded", "true");
  }
  function close() {
    listEl.hidden = true;
    input.setAttribute("aria-expanded", "false");
    active = -1;
  }
  function pick(value) {
    input.value = value;
    close();
    input.dispatchEvent(new Event("change", { bubbles: true }));
    input.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function setActive(i) {
    active = i;
    [...listEl.children].forEach((li, j) => li.classList.toggle("active", j === i));
  }

  input.addEventListener("focus", render);
  input.addEventListener("input", render);
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", (e) => {
    if (listEl.hidden) {
      if (e.key === "ArrowDown") { e.preventDefault(); render(); }
      return;
    }
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(active + 1, options.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(options[active]); }
    else if (e.key === "Escape") { close(); }
  });
  return { refresh: render, close };
}

const makeInput = document.getElementById("make");
const modelInput = document.getElementById("model");
const makeCombo = combobox(makeInput, document.getElementById("make-list"), () => MAKES);
const modelCombo = combobox(modelInput, document.getElementById("model-list"), () => {
  const norm = makeInput.value.trim().toLowerCase();
  const key = Object.keys(MODELS).find(k => k.toLowerCase() === norm);
  return key ? MODELS[key] : [];
});
makeInput.addEventListener("change", () => { modelInput.value = ""; });

const form = document.getElementById("park-form");
const overlay = document.getElementById("overlay");
const result = document.getElementById("result");
const submitBtn = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  result.className = "";
  overlay.classList.add("show");
  submitBtn.disabled = true;

  const payload = {
    license_plate: document.getElementById("plate").value,
    vehicle_make: makeInput.value,
    vehicle_model: modelInput.value,
    visitor_name: document.getElementById("vname").value,
    visitor_phone: document.getElementById("vphone").value,
    visitor_email: document.getElementById("vemail").value
  };

  try {
    const res = await fetch("register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (res.status === 401) { window.location.href = "login"; return; }
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      result.className = "show ok";
      result.innerHTML = "<strong>You&rsquo;re registered.</strong><span class='detail'>" +
        payload.license_plate.toUpperCase() + " is approved for 24 hours. You can park in any guest space.</span>";
      form.reset();
    } else {
      result.className = "show err";
      result.innerHTML = "<strong>Something didn&rsquo;t work.</strong><span class='detail'>" +
        (data.message || data.detail || "Please try again, or text the host.") + "</span>";
    }
  } catch (err) {
    result.className = "show err";
    result.innerHTML = "<strong>Network error.</strong><span class='detail'>Check your connection and try again.</span>";
  } finally {
    overlay.classList.remove("show");
    submitBtn.disabled = false;
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
});
</script>
</body>
</html>
