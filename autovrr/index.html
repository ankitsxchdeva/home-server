<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>parking</title>
<style>
  /* Colophon design language (~/Documents/design/DESIGN.md v0.7, canonical lane).
     Tokens mirror tokens.css: absence of data-theme follows prefers-color-scheme. */
  @font-face {
    font-family: "Lato";
    src: url("fonts/lato-400.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Lato";
    src: url("fonts/lato-700.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    color-scheme: light;
    --bg: #f5f4fa;
    --fg: #30292f;
    --muted: #6a6884;
    --border: #d8d6e8;
    --accent: #355691;
    --accent-hover: #5f5aa2;
    --dim: 0.75;
    --t: 150ms cubic-bezier(0.25, 1, 0.5, 1);
    --focus-ring: 2px solid var(--accent-hover);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1c22;
    --fg: #e8e4f4;
    --muted: #8e8aab;
    --border: #413f54;
    --accent: #8b87c8;
    --accent-hover: #9db8dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1e1c22;
      --fg: #e8e4f4;
      --muted: #8e8aab;
      --border: #413f54;
      --accent: #8b87c8;
      --accent-hover: #9db8dc;
    }
  }

  ::selection { background: var(--accent); color: var(--bg); }
  :focus-visible {
    outline: var(--focus-ring);
    outline-offset: 3px;
    border-radius: 2px;
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Lato", Verdana, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 3.5em 1.25em;
  }
  main { width: 100%; max-width: 380px; }

  /* entrance: one 14px rise + fade, stagger 70ms, lands exactly at rest */
  main > * { animation: enter 450ms cubic-bezier(0.25, 1, 0.5, 1) both; }
  main > *:nth-child(2) { animation-delay: 70ms; }
  main > *:nth-child(3) { animation-delay: 140ms; }
  main > *:nth-child(4) { animation-delay: 210ms; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  h1 {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .lede {
    font-size: 17px;
    line-height: 1.6;
    margin-top: 0.5em;
    max-width: 68ch;
  }

  form { display: grid; gap: 1.75em; margin-top: 1.75em; }
  .field { display: grid; gap: 0.5em; }
  .field.combo { position: relative; }
  label { font-size: 13px; }
  input {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.55em 0.7em;
    transition: border-color var(--t);
  }
  input::placeholder { color: var(--muted); opacity: var(--dim); }
  input:hover { border-color: var(--muted); }
  input:focus { border-color: var(--accent); }
  #plate { text-transform: uppercase; }

  /* popover layer: 1px hairline, radius 3px, one z-index step above content.
     The licensed small shadow applies on the dark theme only. */
  .combo-list {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    margin-top: 0.25em;
    padding: 0.25em;
    list-style: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    max-height: 15em;
    overflow-y: auto;
    z-index: 2;
  }
  :root[data-theme="dark"] .combo-list { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .combo-list { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }
  }
  .combo-list li {
    padding: 0.5em 0.6em;
    border-radius: 2px;
    font-size: 13px;
    cursor: pointer;
    transition: background-color var(--t);
  }
  .combo-list li.active { background: color-mix(in oklch, var(--accent) 10%, var(--bg)); }

  fieldset {
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1em;
    display: grid;
    gap: 1em;
  }
  legend {
    font-size: 12px;
    color: var(--muted);
    padding: 0 0.5em;
  }

  /* the single action is a bordered chip, never a filled button */
  button[type="submit"] {
    width: 100%;
    font: inherit;
    font-weight: 700;
    color: var(--accent);
    background: transparent;
    border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--border));
    border-radius: 2px;
    padding: 0.7em 1em;
    cursor: pointer;
    transition: color var(--t), border-color var(--t), background-color var(--t);
  }
  button[type="submit"]:hover:not(:disabled) {
    color: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  button[type="submit"]:disabled {
    color: var(--muted);
    border-color: var(--border);
    cursor: wait;
  }
  /* indeterminate progress: opacity pulse only, feedback stays in the button */
  button[type="submit"].working { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  #progress {
    display: none;
    font-size: 11px;
    font-style: italic;
    color: var(--muted);
    text-align: center;
  }
  #progress.show { display: block; }

  #result {
    display: none;
    margin-top: 1.75em;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1em;
  }
  #result.show { display: block; }
  #result strong { display: block; font-size: 14px; margin-bottom: 0.25em; }
  #result .detail { font-size: 13px; color: var(--muted); }

  noscript p {
    margin-top: 1.75em;
    font-size: 11px;
    font-style: italic;
    color: var(--muted);
  }

  footer { margin-top: 3.5em; font-size: 11px; color: var(--muted); text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>parking</h1>
    <p class="lede">register your car for 24-hour guest parking.</p>
  </header>

  <form id="park-form" autocomplete="off">
    <div class="field">
      <label for="plate">license plate</label>
      <input id="plate" name="plate" required maxlength="10"
             placeholder="ABC1234" autocapitalize="characters" spellcheck="false">
    </div>

    <div class="field combo">
      <label for="make">vehicle make</label>
      <input id="make" name="make" required maxlength="40" placeholder="start typing…"
             role="combobox" aria-expanded="false" aria-controls="make-list" spellcheck="false">
      <ul id="make-list" class="combo-list" role="listbox" hidden></ul>
    </div>

    <div class="field combo">
      <label for="model">vehicle model</label>
      <input id="model" name="model" required maxlength="40" placeholder="start typing…"
             role="combobox" aria-expanded="false" aria-controls="model-list" spellcheck="false">
      <ul id="model-list" class="combo-list" role="listbox" hidden></ul>
    </div>

    <fieldset>
      <legend>about you (optional)</legend>
      <div class="field">
        <label for="vname">name</label>
        <input id="vname" name="vname" maxlength="80" placeholder="{{GUEST_NAME}}">
      </div>
      <div class="field">
        <label for="vphone">phone</label>
        <input id="vphone" name="vphone" type="tel" maxlength="20" placeholder="{{GUEST_PHONE}}">
      </div>
      <div class="field">
        <label for="vemail">email</label>
        <input id="vemail" name="vemail" type="email" maxlength="80" placeholder="{{GUEST_EMAIL}}">
      </div>
    </fieldset>

    <div class="field">
      <button type="submit" id="submit">register parking</button>
      <p id="progress" role="status">registering with vrr parking, usually 20-40 seconds. don't close this page.</p>
    </div>
  </form>
  <noscript><p>this form needs javascript to register.</p></noscript>

  <div id="result" role="status"></div>

  <footer>passes are valid 24 hours.</footer>
</main>

<script>
const MAKES = ["Acura","Audi","BMW","Buick","Cadillac","Chevrolet","Chrysler","Dodge","Ford","Genesis","GMC","Honda","Hyundai","Infiniti","Jeep","Kia","Lexus","Lincoln","Mazda","Mercedes-Benz","Mini","Mitsubishi","Nissan","Polestar","Porsche","Ram","Rivian","Subaru","Tesla","Toyota","Volkswagen","Volvo"];
const MODELS = {
  Acura: ["Integra","TLX","RDX","MDX"],
  Audi: ["A3","A4","A6","Q3","Q5","Q7","e-tron"],
  BMW: ["2 Series","3 Series","4 Series","5 Series","X1","X3","X5","i4","iX"],
  Buick: ["Encore","Encore GX","Envision","Enclave"],
  Cadillac: ["CT4","CT5","XT4","XT5","Escalade","Lyriq"],
  Chevrolet: ["Silverado","Equinox","Malibu","Traverse","Tahoe","Suburban","Colorado","Bolt","Blazer"],
  Chrysler: ["300","Pacifica","Voyager"],
  Dodge: ["Charger","Challenger","Durango","Hornet"],
  Ford: ["F-150","Mustang","Escape","Explorer","Edge","Bronco","Maverick","Fusion","Ranger"],
  Genesis: ["G70","G80","G90","GV70","GV80"],
  GMC: ["Sierra","Yukon","Acadia","Terrain","Canyon"],
  Honda: ["Civic","Accord","CR-V","HR-V","Pilot","Odyssey","Ridgeline","Passport"],
  Hyundai: ["Elantra","Sonata","Tucson","Santa Fe","Kona","Palisade","Ioniq 5","Ioniq 6"],
  Infiniti: ["Q50","Q60","QX50","QX55","QX60","QX80"],
  Jeep: ["Wrangler","Grand Cherokee","Cherokee","Compass","Gladiator","Wagoneer"],
  Kia: ["Forte","K5","Sportage","Sorento","Telluride","Soul","EV6","Seltos"],
  Lexus: ["IS","ES","LS","NX","RX","GX","LX"],
  Lincoln: ["Corsair","Nautilus","Aviator","Navigator"],
  Mazda: ["Mazda3","Mazda6","CX-30","CX-5","CX-50","CX-90"],
  "Mercedes-Benz": ["A-Class","C-Class","E-Class","S-Class","GLA","GLC","GLE","GLS","EQS"],
  Mini: ["Cooper","Cooper S","Countryman","Clubman"],
  Mitsubishi: ["Outlander","Outlander Sport","Eclipse Cross","Mirage"],
  Nissan: ["Sentra","Altima","Maxima","Rogue","Pathfinder","Frontier","Kicks","Leaf","Ariya"],
  Polestar: ["Polestar 2","Polestar 3","Polestar 4"],
  Porsche: ["911","718","Taycan","Panamera","Macan","Cayenne"],
  Ram: ["1500","2500","ProMaster"],
  Rivian: ["R1T","R1S"],
  Subaru: ["Impreza","Legacy","Crosstrek","Forester","Outback","Ascent","WRX","BRZ"],
  Tesla: ["Model 3","Model Y","Model S","Model X","Cybertruck"],
  Toyota: ["Corolla","Camry","RAV4","Highlander","Tacoma","Tundra","Prius","4Runner","Sienna","Corolla Cross","GR86"],
  Volkswagen: ["Jetta","Golf","GTI","Taos","Tiguan","Atlas","ID.4"],
  Volvo: ["S60","S90","XC40","XC60","XC90","EX30","EX90"]
};

// Lightweight combobox: opens on focus, live-filters, tap/arrow+enter to
// pick, freeform text always allowed.
function combobox(input, listEl, getOptions) {
  let options = [], active = -1;

  function render() {
    const q = input.value.trim().toLowerCase();
    options = getOptions().filter(o => !q || o.toLowerCase().includes(q)).slice(0, 8);
    listEl.replaceChildren();
    active = -1;
    if (!options.length) { close(); return; }
    options.forEach((o, i) => {
      const li = document.createElement("li");
      li.textContent = o;
      li.setAttribute("role", "option");
      li.addEventListener("pointerdown", (e) => { e.preventDefault(); pick(o); });
      li.addEventListener("pointerenter", () => setActive(i));
      listEl.appendChild(li);
    });
    listEl.hidden = false;
    input.setAttribute("aria-expanded", "true");
  }
  function close() {
    listEl.hidden = true;
    input.setAttribute("aria-expanded", "false");
    active = -1;
  }
  function pick(value) {
    input.value = value;
    close();
    input.dispatchEvent(new Event("change", { bubbles: true }));
    input.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function setActive(i) {
    active = i;
    [...listEl.children].forEach((li, j) => li.classList.toggle("active", j === i));
  }

  input.addEventListener("focus", render);
  input.addEventListener("input", render);
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", (e) => {
    if (listEl.hidden) {
      if (e.key === "ArrowDown") { e.preventDefault(); render(); }
      return;
    }
    if (e.key === "ArrowDown") { e.preventDefault(); setActive(Math.min(active + 1, options.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive(Math.max(active - 1, 0)); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(options[active]); }
    else if (e.key === "Escape") { close(); }
  });
  return { refresh: render, close };
}

const makeInput = document.getElementById("make");
const modelInput = document.getElementById("model");
const makeCombo = combobox(makeInput, document.getElementById("make-list"), () => MAKES);
const modelCombo = combobox(modelInput, document.getElementById("model-list"), () => {
  const norm = makeInput.value.trim().toLowerCase();
  const key = Object.keys(MODELS).find(k => k.toLowerCase() === norm);
  return key ? MODELS[key] : [];
});
makeInput.addEventListener("change", () => { modelInput.value = ""; });

const form = document.getElementById("park-form");
const progress = document.getElementById("progress");
const result = document.getElementById("result");
const submitBtn = document.getElementById("submit");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  result.className = "";
  submitBtn.disabled = true;
  submitBtn.classList.add("working");
  submitBtn.textContent = "registering…";
  progress.classList.add("show");

  const payload = {
    license_plate: document.getElementById("plate").value,
    vehicle_make: makeInput.value,
    vehicle_model: modelInput.value,
    visitor_name: document.getElementById("vname").value,
    visitor_phone: document.getElementById("vphone").value,
    visitor_email: document.getElementById("vemail").value
  };

  try {
    const res = await fetch("register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (res.status === 401) { window.location.href = "login"; return; }
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      result.className = "show";
      result.innerHTML = "<strong>you're registered.</strong><span class='detail'>" +
        payload.license_plate.toUpperCase() + " is approved for 24 hours. park in any guest space.</span>";
      form.reset();
    } else {
      result.className = "show";
      result.innerHTML = "<strong>registration didn't go through.</strong><span class='detail'>" +
        (data.message || data.detail || "try again, or text the host.") + "</span>";
    }
  } catch (err) {
    result.className = "show";
    result.innerHTML = "<strong>network error.</strong><span class='detail'>check your connection and try again.</span>";
  } finally {
    submitBtn.disabled = false;
    submitBtn.classList.remove("working");
    submitBtn.textContent = "register parking";
    progress.classList.remove("show");
    result.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
});
</script>
</body>
</html>
