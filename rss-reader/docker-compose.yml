services:
  rss-reader:
    # App code + Dockerfile live in the lede repo (backend/); CI there builds
    # and pushes this image on every push to main. App updates arrive via
    # watchtower (daily 04:00) or immediately with:
    #   docker compose pull rss-reader && docker compose up -d rss-reader
    image: ghcr.io/ankitsxchdeva/lede-backend:latest
    container_name: rss-reader
    restart: unless-stopped
    cpus: "1.5"        # background digest builder; cap so build cycles can't hog the Pi
    # No published port — public via funnel :10000 → caddy :8089 (/lede route),
    # tailnet via https://rss.ankit.casa.
    volumes:
      - ./data:/app/data     # data.json output
      - ./feeds.yaml:/app/feeds.yaml:ro   # edit live; next cycle picks it up
    env_file:
      - .env
    networks:
      - default
      - caddy              # caddy reverse-proxies /lede → rss-reader:8000

networks:
  caddy:
    external: true         # created by the caddy project
    name: home-server_default
